name: ech_browser
description: 点开即用的 ECH 独立浏览器（flutter 壳 + go ech 内核，webview 拦截免改系统配置）
publish_to: 'none'
version: 0.3.3

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  ffi: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
