name: release

on:
  push:
    tags:
      - "v*"

# 直接发布正式 Release，绝不产出 draft（同 ech-proxy 纪律）。
permissions:
  contents: write

jobs:
  build-go:
    name: go c-shared (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            goos: linux
            goarch: amd64
            out: ech-browser-linux-amd64.so
            cc: ""
          - target: windows-amd64
            goos: windows
            goarch: amd64
            out: ech-browser-windows-amd64.dll
            cc: x86_64-w64-mingw32-gcc
          - target: android-arm64
            goos: android
            goarch: arm64
            out: ech-browser-android-arm64.so
            cc: aarch64-linux-android21-clang
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install mingw-w64 (windows target)
        if: matrix.goos == 'windows'
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Setup Android NDK (android target)
        if: matrix.goos == 'android'
        run: |
          NDK_VERSION="r27"
          curl -L -o /tmp/ndk.zip "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          unzip -q /tmp/ndk.zip -d /tmp/
          echo "/tmp/android-ndk-${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Tidy modules (CI-only)
        run: go mod tidy

      - name: Build c-shared
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
          CGO_ENABLED: "1"
        run: go build -buildmode=c-shared -trimpath -ldflags="-s -w" -o dist/${{ matrix.out }} ./engine/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-${{ matrix.target }}
          path: dist/

  flutter-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Generate Windows runner (if missing)
        run: flutter create --platforms=windows --project-name ech_browser .
      - name: Patch flutter_inappwebview_windows CMake (MSVC 14.51 STL1011)
        shell: pwsh
        run: |
          # VS 18 / MSVC 14.51 把 <experimental/coroutine> 弃用升级为硬错误
          # (STL1011 / C2338)，插件 CMake 未带静默宏；在 pub 缓存里幂等注入。
          $plug = Get-ChildItem "$env:LOCALAPPDATA\Pub\Cache\hosted\pub.dev" -Directory -Filter "flutter_inappwebview_windows-*" | Select-Object -First 1
          $cm = Join-Path $plug.FullName "windows\CMakeLists.txt"
          $anchor = "project(`${PROJECT_NAME} LANGUAGES CXX)"
          $inject = "add_definitions(-D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS)"
          $text = Get-Content $cm -Raw
          if ($text -notmatch "SILENCE_EXPERIMENTAL_COROUTINE") {
            $text = $text.Replace($anchor, "$anchor`n$inject")
            Set-Content $cm $text
            Write-Host "patched: $cm"
          } else {
            Write-Host "already patched: $cm"
          }
      - name: Build Windows release
        run: flutter build windows --release
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-windows
          path: build/windows/x64/runner/Release/

  release:
    needs: [build-go, flutter-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: dist

      - name: Assemble Windows zip (exe + go dll)
        run: |
          mkdir -p release/windows
          cp dist/flutter-windows/ech_browser.exe release/windows/
          # zip 内 dll 必须叫 echproxy.dll（Flutter 运行时 DynamicLibrary.open('echproxy.dll')）
          cp dist/go-windows-amd64/ech-browser-windows-amd64.dll release/windows/echproxy.dll
          (cd release/windows && zip -q -r ../ech-browser-windows-x64.zip .)
          ls -la release/

      - name: Create release (idempotent, no assets)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" \
              --title "${{ github.ref_name }}" \
              --notes "ech-browser ${{ github.ref_name }} — 点开即用的**通用** ECH 独立浏览器（flutter 壳 + go ech 内核）。任意 http(s) 网址可访问；webview 拦截请求交给 go 内核做 ECH/SNI 伪装直连，**无需修改系统 hosts、无需手动安装证书**。

              - \`ech-browser-windows-x64.zip\`：Windows 桌面版（exe + echproxy.dll 同目录即用）
              - \`ech-browser-linux-amd64.so\` / \`ech-browser-android-arm64.so\` / \`ech-browser-windows-amd64.dll\`：go 内核 c-shared 库

              测试仅在 CI 执行（本仓禁止本地测试）。"

      - name: Upload assets (per-file, existing asset kept)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -R dist release
          for f in \
            release/ech-browser-windows-x64.zip \
            dist/go-linux-amd64/ech-browser-linux-amd64.so \
            dist/go-windows-amd64/ech-browser-windows-amd64.dll \
            dist/go-android-arm64/ech-browser-android-arm64.so; do
            gh release upload "${{ github.ref_name }}" "$f" --repo "${{ github.repository }}" \
              || echo "::warning::upload failed for $f"
          done
