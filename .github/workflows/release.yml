name: release

on:
  push:
    tags:
      - "v*"

# 直接发布正式 Release，绝不产出 draft（同 ech-proxy 纪律）。
permissions:
  contents: write

jobs:
  build-go:
    name: go c-shared (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            goos: linux
            goarch: amd64
            out: ech-browser-linux-amd64.so
            cc: ""
            ldflags: "-s -w"
          - target: windows-amd64
            goos: windows
            goarch: amd64
            out: ech-browser-windows-amd64.dll
            cc: x86_64-w64-mingw32-gcc
            ldflags: "-s -w -extldflags=-static"
          - target: android-arm64
            goos: android
            goarch: arm64
            out: ech-browser-android-arm64.so
            cc: aarch64-linux-android21-clang
            ldflags: "-s -w"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install mingw-w64 (windows target)
        if: matrix.goos == 'windows'
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Setup Android NDK (android target)
        if: matrix.goos == 'android'
        run: |
          NDK_VERSION="r27"
          curl -L -o /tmp/ndk.zip "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          unzip -q /tmp/ndk.zip -d /tmp/
          echo "/tmp/android-ndk-${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Tidy modules (CI-only)
        run: go mod tidy

      - name: Build c-shared
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
          CGO_ENABLED: "1"
        run: go build -buildmode=c-shared -trimpath -ldflags="${{ matrix.ldflags }}" -o dist/${{ matrix.out }} ./engine/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-${{ matrix.target }}
          path: dist/

  flutter-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Generate Windows runner (if missing)
        run: flutter create --platforms=windows --project-name ech_browser .
      - name: Patch flutter_inappwebview_windows CMake (MSVC 14.51 STL1011)
        shell: pwsh
        run: |
          # VS 18 / MSVC 14.51 把 <experimental/coroutine> 弃用升级为硬错误
          # (STL1011 / C2338)，插件 CMake 未带静默宏；在 pub 缓存里幂等注入。
          $plug = Get-ChildItem "$env:LOCALAPPDATA\Pub\Cache\hosted\pub.dev" -Directory -Filter "flutter_inappwebview_windows-*" | Select-Object -First 1
          $cm = Join-Path $plug.FullName "windows\CMakeLists.txt"
          $anchor = "project(`${PROJECT_NAME} LANGUAGES CXX)"
          $inject = "add_definitions(-D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS)"
          $text = Get-Content $cm -Raw
          if ($text -notmatch "SILENCE_EXPERIMENTAL_COROUTINE") {
            $text = $text.Replace($anchor, "$anchor`n$inject")
            Set-Content $cm $text
            Write-Host "patched: $cm"
          } else {
            Write-Host "already patched: $cm"
          }
      - name: Build Windows release
        run: flutter build windows --release
      - name: Stage release folder (exe + 全部运行库 + VC++ runtime)
        shell: pwsh
        run: |
          # 关键：不能只打 exe。Flutter Windows 运行需要 flutter_windows.dll、
          # 插件 dll、data/（icudtl.dat + flutter_assets），缺任一启动即报缺 dll。
          $src = "build/windows/x64/runner/Release"
          $dst = "stage/windows"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item -Recurse -Force "$src/*" $dst
          # app-local VC++ runtime（避免用户机缺 msvcp140/vcruntime140）
          $crt = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\*\*\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($crt) {
            Copy-Item -Force "$($crt.FullName)\*.dll" $dst
            Write-Host "VC runtime: $($crt.FullName)"
          } else {
            Write-Warning "VC++ CRT redist not found; relying on system runtime"
          }
          Get-ChildItem $dst -Recurse | Select-Object FullName, Length
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-windows
          path: stage/windows/

  flutter-android:
    needs: [build-go]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/download-artifact@v4
        with:
          name: go-android-arm64
          path: dist/go-android-arm64
      - run: flutter pub get
      - name: Patch flutter_inappwebview_android proguard (新 AGP 不再支持 proguard-android.txt)
        run: |
          PLUG=$(ls -d "$HOME/.pub-cache/hosted/pub.dev/flutter_inappwebview_android-"* | head -1)
          sed -i "s/proguard-android.txt/proguard-android-optimize.txt/" "$PLUG/android/build.gradle"
          grep -n "proguard" "$PLUG/android/build.gradle" || true
      - name: Generate Android runner & inject INTERNET + usesCleartextTraffic + libechproxy.so
        run: |
          flutter create --platforms=android --project-name ech_browser .
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp dist/go-android-arm64/ech-browser-android-arm64.so android/app/src/main/jniLibs/arm64-v8a/libechproxy.so
          python3 - <<'PY'
          from pathlib import Path
          mf = Path("android/app/src/main/AndroidManifest.xml")
          txt = mf.read_text(encoding="utf-8")
          if "android.permission.INTERNET" not in txt:
              txt = txt.replace("<application", '<uses-permission android:name="android.permission.INTERNET"/>\n    <application', 1)
          if "usesCleartextTraffic" not in txt:
              txt = txt.replace("<application", '<application android:usesCleartextTraffic="true"', 1)
          mf.write_text(txt, encoding="utf-8")
          PY
      - name: Build Android APK (arm64-v8a)
        run: flutter build apk --release --target-platform android-arm64
      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-android
          path: build/app/outputs/flutter-apk/app-release.apk

  # 打包 + 对「用户实际下载的包」做启动 smoke：构建通过 ≠ 能启动。
  package-windows:
    needs: [build-go, flutter-windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: flutter-windows
          path: flutterwin
      - uses: actions/download-artifact@v4
        with:
          name: go-windows-amd64
          path: godll

      - name: Assemble release folder
        shell: pwsh
        run: |
          $dst = "release/windows"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item -Recurse -Force "flutterwin/*" $dst
          # go 内核 dll 必须与 exe 同目录且名为 echproxy.dll（运行时按此名加载）
          Copy-Item -Force "godll/ech-browser-windows-amd64.dll" "$dst/echproxy.dll"
          Get-ChildItem $dst | Select-Object Name

      - name: Verify required runtime files
        shell: pwsh
        run: |
          $dst = "release/windows"
          $required = @("ech_browser.exe", "echproxy.dll", "flutter_windows.dll",
                        "flutter_inappwebview_windows_plugin.dll", "data/icudtl.dat", "data/flutter_assets")
          $fail = $false
          foreach ($f in $required) {
            if (-not (Test-Path (Join-Path $dst $f))) {
              Write-Error "缺运行必需项: $f"; $fail = $true
            }
          }
          if ($fail) { exit 1 }
          Write-Host "required runtime files OK"

      - name: Zip (flat, files at zip root)
        shell: pwsh
        run: |
          $dst = "release/windows"
          New-Item -ItemType Directory -Force -Path "release/out" | Out-Null
          Compress-Archive -Path "$dst/*" -DestinationPath "release/out/ech-browser-windows-x64.zip" -CompressionLevel Optimal
          Get-Item "release/out/ech-browser-windows-x64.zip" | Select-Object Name, Length

      - name: Bisect — 不加载内核时进程是否稳定（区分壳 vs 内核）
        shell: pwsh
        run: |
          # 两轮对照：① 跳过内核 ② 正常启动。都只跑 8s 看是否自行退出。
          foreach ($mode in @("nokernel", "kernel")) {
            if ($mode -eq "nokernel") { $env:ECH_NO_KERNEL = "1"; $env:ECH_HEADLESS = "1" }
            else { Remove-Item Env:ECH_NO_KERNEL -ErrorAction SilentlyContinue; $env:ECH_HEADLESS = "1" }
            $p = Start-Process -FilePath "release/windows/ech_browser.exe" -WorkingDirectory "release/windows" -PassThru `
                   -RedirectStandardOutput "bisect-$mode.out.txt" -RedirectStandardError "bisect-$mode.err.txt"
            Start-Sleep -Seconds 8
            $exited = $p.HasExited
            $code = if ($exited) { $p.ExitCode } else { 0 }
            Write-Host ("bisect[$mode]: exited={0} code=0x{1:X8}" -f $exited, $code)
            if (-not $exited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Smoke test — 内核真干活（curl 内核 + ECH 请求）+ 崩溃码分级
        shell: pwsh
        run: |
          # 无头 runner 上 WebView2 可能无法创建（GUI 环境缺失）→ 进程可能以
          # 0xC0000005 退出，这**不是**产品缺陷。因此分两层验证：
          #   ① 内核必须起来，且能真的发一次 ECH/SNI 上游请求（curl + Host 头）
          #   ② 进程退出码分级：缺 dll(0xC0000135)/坏镜像(0xC000007B) 判失败；
          #      访问违例(0xC0000005) 在无头环境记警告（WebView2 限制）
          $dir = "release/windows"
          $env:ECH_HEADLESS = "1"   # smoke 只验证内核；无头 WebView2 渲染有偶发崩溃
          $exe = "$dir/ech_browser.exe"
          if (-not (Test-Path $exe)) { Write-Error "missing exe: $exe"; exit 1 }
          $p = Start-Process -FilePath $exe -PassThru `
                 -RedirectStandardOutput "$dir/smoke.out.txt" -RedirectStandardError "$dir/smoke.err.txt"
          $kernelOK = $false; $echOK = $false
          for ($i = 0; $i -lt 25; $i++) {
            if (-not $kernelOK) {
              try {
                $r = Invoke-WebRequest -Uri "http://127.0.0.1:8443/logs" -TimeoutSec 3 -UseBasicParsing
                if ($r.StatusCode -eq 200) { $kernelOK = $true; Write-Host "kernel up after $($i+1)s" }
              } catch { }
            }
            if ($kernelOK -and -not $echOK) {
              try {
                $r2 = Invoke-WebRequest -Uri "http://127.0.0.1:8443/" -Headers @{ Host = "www.pixiv.net" } -TimeoutSec 20 -UseBasicParsing
                if ($r2.StatusCode -ge 200 -and $r2.StatusCode -lt 500) {
                  $echOK = $true; Write-Host "ECH upstream request via kernel: HTTP $($r2.StatusCode)"
                }
              } catch { Write-Host "ech probe: $($_.Exception.Message)" }
            }
            if ($kernelOK -and $echOK) { break }
            if ($p.HasExited) { break }
            Start-Sleep -Seconds 1
          }
          Write-Host "--- stderr (tail) ---"
          Get-Content "$dir/smoke.err.txt" -ErrorAction SilentlyContinue | Select-Object -Last 12
          $exited = $p.HasExited; $code = if ($exited) { $p.ExitCode } else { 0 }
          if (-not $exited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          if (-not $kernelOK) { Write-Error "内核端口 8443 从未响应（StartProxy 失败）"; exit 1 }
          Write-Host "kernel OK; ECH request OK=$echOK"
          Start-Sleep -Seconds 5
          Write-Host "after idle 5s: exited=$($p.HasExited)"
          if ($p.HasExited) {
            Write-Host ("idle exit code: 0x{0:X8}" -f $p.ExitCode)
            Write-Host "--- Defender threat detections (若命中=杀软误杀) ---"
            Get-MpThreatDetection -ErrorAction SilentlyContinue | Select-Object -First 5 | Format-List InitialDetectionTime, ProcessName, Resources
            Write-Host "--- Application event log (ech_browser) ---"
            Get-WinEvent -LogName Application -MaxEvents 40 -ErrorAction SilentlyContinue |
              Where-Object { $_.Message -match 'ech_browser|echproxy' } | Select-Object -First 5 |
              Format-List TimeCreated, Id, ProviderName, Message
            Write-Host "--- stderr (full) ---"
            Get-Content "$dir/smoke.err.txt" -ErrorAction SilentlyContinue
            Write-Error "进程空闲期自行退出（与用户侧闪退同症状），见上方诊断"
            exit 1
          }
          # 验证请求处理链的 panic 兜底：/__panic 必须返回 500 且进程不退出。
          # （Go handler goroutine 里未 recover 的 panic 会 abort 整个进程 = 闪退）
          # 用 curl.exe 取原始状态码（Invoke-WebRequest 对异常响应会抛发送错误）
          $code = & curl.exe -s -o NUL -w "%{http_code}" --max-time 15 "http://127.0.0.1:8443/__panic"
          Write-Host "panic endpoint http_code=$code exited=$($p.HasExited)"
          if ($p.HasExited) {
            Write-Host ("exit code: 0x{0:X8}" -f $p.ExitCode)
            Write-Host "--- kernel.log (full) ---"
            Get-Content "$env:USERPROFILE\.ech-browser\kernel.log" -ErrorAction SilentlyContinue
            Write-Host "--- stderr (full) ---"
            Get-Content "$dir/smoke.err.txt" -ErrorAction SilentlyContinue
            Write-Error "panic 后进程退出（recover 未生效，闪退风险）"
            exit 1
          }
          if ($code -ne "500") { Write-Error "panic 兜底异常：http_code=$code"; exit 1 }
          $code2 = & curl.exe -s -o NUL -w "%{http_code}" --max-time 10 "http://127.0.0.1:8443/health"
          if ($code2 -ne "200") { Write-Error "panic 后内核 /health=$code2（进程可能已崩溃）"; exit 1 }
          Write-Host "panic recovery OK; process alive"
          if ($exited) {
            $hex = "0x{0:X8}" -f $code
            Write-Host "process exited: $hex"
            if ($code -eq 0xC0000135 -or $code -eq 0xC000007B) {
              Write-Error "缺 dll / 坏镜像（$hex）——打包不完整"; exit 1
            }
            if ($code -eq 0xC0000005) {
              Write-Warning "无头环境访问违例（$hex）：多为 WebView2 无 GUI 会话所致；内核已验证可用"
            } else {
              Write-Warning "进程提前退出（$hex）：非缺 dll 类；内核已验证可用"
            }
          } else {
            Write-Host "process alive; smoke passed"
          }

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: release/out/ech-browser-windows-x64.zip

  release:
    needs: [build-go, package-windows, flutter-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: dist

      - name: Create release (idempotent, no assets)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" \
              --title "${{ github.ref_name }}" \
              --notes "ech-browser ${{ github.ref_name }} — 点开即用的**通用** ECH 独立浏览器（flutter 壳 + go ech 内核）。任意 http(s) 网址可访问；webview 拦截请求交给 go 内核做 ECH/SNI 伪装直连，**无需修改系统 hosts、无需手动安装证书**。

              - \`ech-browser-windows-x64.zip\`：Windows 桌面版（**整个解压**即用，已含全部运行库与 VC++ runtime；发布前经 CI 启动 smoke 验证）
              - \`ech-browser-linux-amd64.so\` / \`ech-browser-android-arm64.so\` / \`ech-browser-windows-amd64.dll\`：go 内核 c-shared 库\n              - \`ech-browser-android-arm64.apk\`：Android arm64 APK（内置内核，安装即用）

              测试与启动 smoke 仅在 CI 执行（本仓禁止本地测试）。"

      - name: Upload assets (per-file, existing asset kept)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          cp dist/flutter-android/app-release.apk release/ech-browser-android-arm64.apk
          ls -R dist | head -40
          for f in \
            dist/windows-zip/ech-browser-windows-x64.zip \
            release/ech-browser-android-arm64.apk \
            dist/go-linux-amd64/ech-browser-linux-amd64.so \
            dist/go-windows-amd64/ech-browser-windows-amd64.dll \
            dist/go-android-arm64/ech-browser-android-arm64.so; do
            gh release upload "${{ github.ref_name }}" "$f" --repo "${{ github.repository }}" \
              || echo "::warning::upload failed for $f"
          done
