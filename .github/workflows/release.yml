name: release

on:
  push:
    tags:
      - "v*"

# 直接发布正式 Release，绝不产出 draft（同 ech-proxy 纪律）。
permissions:
  contents: write

jobs:
  build-go:
    name: go c-shared (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            goos: linux
            goarch: amd64
            out: ech-browser-linux-amd64.so
            cc: ""
            ldflags: "-s -w"
          - target: windows-amd64
            goos: windows
            goarch: amd64
            out: ech-browser-windows-amd64.dll
            cc: x86_64-w64-mingw32-gcc
            ldflags: "-s -w -extldflags=-static"
          - target: android-arm64
            goos: android
            goarch: arm64
            out: ech-browser-android-arm64.so
            cc: aarch64-linux-android21-clang
            ldflags: "-s -w"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install mingw-w64 (windows target)
        if: matrix.goos == 'windows'
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Setup Android NDK (android target)
        if: matrix.goos == 'android'
        run: |
          NDK_VERSION="r27"
          curl -L -o /tmp/ndk.zip "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          unzip -q /tmp/ndk.zip -d /tmp/
          echo "/tmp/android-ndk-${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Tidy modules (CI-only)
        run: go mod tidy

      - name: Build c-shared
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
          CGO_ENABLED: "1"
        run: go build -buildmode=c-shared -trimpath -ldflags="${{ matrix.ldflags }}" -o dist/${{ matrix.out }} ./engine/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-${{ matrix.target }}
          path: dist/

  flutter-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Generate Windows runner (if missing)
        run: flutter create --platforms=windows --project-name ech_browser .
      - name: Patch flutter_inappwebview_windows CMake (MSVC 14.51 STL1011)
        shell: pwsh
        run: |
          # VS 18 / MSVC 14.51 把 <experimental/coroutine> 弃用升级为硬错误
          # (STL1011 / C2338)，插件 CMake 未带静默宏；在 pub 缓存里幂等注入。
          $plug = Get-ChildItem "$env:LOCALAPPDATA\Pub\Cache\hosted\pub.dev" -Directory -Filter "flutter_inappwebview_windows-*" | Select-Object -First 1
          $cm = Join-Path $plug.FullName "windows\CMakeLists.txt"
          $anchor = "project(`${PROJECT_NAME} LANGUAGES CXX)"
          $inject = "add_definitions(-D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS)"
          $text = Get-Content $cm -Raw
          if ($text -notmatch "SILENCE_EXPERIMENTAL_COROUTINE") {
            $text = $text.Replace($anchor, "$anchor`n$inject")
            Set-Content $cm $text
            Write-Host "patched: $cm"
          } else {
            Write-Host "already patched: $cm"
          }
      - name: Build Windows release
        run: flutter build windows --release
      - name: Stage release folder (exe + 全部运行库 + VC++ runtime)
        shell: pwsh
        run: |
          # 关键：不能只打 exe。Flutter Windows 运行需要 flutter_windows.dll、
          # 插件 dll、data/（icudtl.dat + flutter_assets），缺任一启动即报缺 dll。
          $src = "build/windows/x64/runner/Release"
          $dst = "stage/windows"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item -Recurse -Force "$src/*" $dst
          # app-local VC++ runtime（避免用户机缺 msvcp140/vcruntime140）
          $crt = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\*\*\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($crt) {
            Copy-Item -Force "$($crt.FullName)\*.dll" $dst
            Write-Host "VC runtime: $($crt.FullName)"
          } else {
            Write-Warning "VC++ CRT redist not found; relying on system runtime"
          }
          Get-ChildItem $dst -Recurse | Select-Object FullName, Length
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-windows
          path: stage/windows/

  # 打包 + 对「用户实际下载的包」做启动 smoke：构建通过 ≠ 能启动。
  package-windows:
    needs: [build-go, flutter-windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: flutter-windows
          path: flutterwin
      - uses: actions/download-artifact@v4
        with:
          name: go-windows-amd64
          path: godll

      - name: Assemble release folder
        shell: pwsh
        run: |
          $dst = "release/windows"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item -Recurse -Force "flutterwin/*" $dst
          # go 内核 dll 必须与 exe 同目录且名为 echproxy.dll（运行时按此名加载）
          Copy-Item -Force "godll/ech-browser-windows-amd64.dll" "$dst/echproxy.dll"
          Get-ChildItem $dst | Select-Object Name

      - name: Verify required runtime files
        shell: pwsh
        run: |
          $dst = "release/windows"
          $required = @("ech_browser.exe", "echproxy.dll", "flutter_windows.dll",
                        "flutter_inappwebview_windows_plugin.dll", "data/icudtl.dat", "data/flutter_assets")
          $fail = $false
          foreach ($f in $required) {
            if (-not (Test-Path (Join-Path $dst $f))) {
              Write-Error "缺运行必需项: $f"; $fail = $true
            }
          }
          if ($fail) { exit 1 }
          Write-Host "required runtime files OK"

      - name: Zip (flat, files at zip root)
        shell: pwsh
        run: |
          $dst = "release/windows"
          New-Item -ItemType Directory -Force -Path "release/out" | Out-Null
          Compress-Archive -Path "$dst/*" -DestinationPath "release/out/ech-browser-windows-x64.zip" -CompressionLevel Optimal
          Get-Item "release/out/ech-browser-windows-x64.zip" | Select-Object Name, Length

      - name: Smoke test — 启动 exe（cwd=包目录）+ 验证 go 内核端口
        shell: pwsh
        run: |
          $dir = (Resolve-Path "release/windows").Path
          $exe = Join-Path $dir "ech_browser.exe"
          $p = Start-Process -FilePath $exe -WorkingDirectory $dir -PassThru `
                 -RedirectStandardOutput "$dir/smoke.out.txt" -RedirectStandardError "$dir/smoke.err.txt"
          Start-Sleep -Seconds 10
          Write-Host "--- stderr (tail) ---"
          Get-Content "$dir/smoke.err.txt" -ErrorAction SilentlyContinue | Select-Object -Last 8
          if ($p.HasExited) {
            Write-Error ("app exited early, exit code: 0x{0:X8} (0xC0000135=DLL_NOT_FOUND, 0xC000007B=BAD_IMAGE)" -f $p.ExitCode)
            exit 1
          }
          Write-Host "app alive after 10s (pid $($p.Id))"
          $kernelOK = $false
          for ($i = 0; $i -lt 10; $i++) {
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:8443/logs" -TimeoutSec 3 -UseBasicParsing
              if ($r.StatusCode -eq 200) { $kernelOK = $true; break }
            } catch { Start-Sleep -Seconds 2 }
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $kernelOK) {
            Write-Error "go 内核端口 127.0.0.1:8443 未响应（StartProxy 未起来）"
            exit 1
          }
          Write-Host "go kernel responded on 127.0.0.1:8443 — smoke passed"

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: release/out/ech-browser-windows-x64.zip

  release:
    needs: [build-go, package-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: dist

      - name: Create release (idempotent, no assets)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" \
              --title "${{ github.ref_name }}" \
              --notes "ech-browser ${{ github.ref_name }} — 点开即用的**通用** ECH 独立浏览器（flutter 壳 + go ech 内核）。任意 http(s) 网址可访问；webview 拦截请求交给 go 内核做 ECH/SNI 伪装直连，**无需修改系统 hosts、无需手动安装证书**。

              - \`ech-browser-windows-x64.zip\`：Windows 桌面版（**整个解压**即用，已含全部运行库与 VC++ runtime；发布前经 CI 启动 smoke 验证）
              - \`ech-browser-linux-amd64.so\` / \`ech-browser-android-arm64.so\` / \`ech-browser-windows-amd64.dll\`：go 内核 c-shared 库

              测试与启动 smoke 仅在 CI 执行（本仓禁止本地测试）。"

      - name: Upload assets (per-file, existing asset kept)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -R dist | head -40
          for f in \
            dist/windows-zip/ech-browser-windows-x64.zip \
            dist/go-linux-amd64/ech-browser-linux-amd64.so \
            dist/go-windows-amd64/ech-browser-windows-amd64.dll \
            dist/go-android-arm64/ech-browser-android-arm64.so; do
            gh release upload "${{ github.ref_name }}" "$f" --repo "${{ github.repository }}" \
              || echo "::warning::upload failed for $f"
          done
