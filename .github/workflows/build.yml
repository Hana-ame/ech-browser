name: build

on:
  push:
    branches: [main]
  pull_request:

# 本仓纪律：禁止本地测试。所有编译/测试/静态检查只在 CI 执行。
jobs:
  go-test:
    name: go vet & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Tidy modules
        run: go mod tidy
      - name: Go vet
        run: go vet ./...
      - name: Go unit tests
        run: go test -v -race ./...

  go-cshared:
    name: go c-shared (${{ matrix.target }})
    needs: [go-test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            goos: linux
            goarch: amd64
            out: libechproxy.so
            cc: ""
            ldflags: "-s -w"
          - target: windows-amd64
            goos: windows
            goarch: amd64
            out: echproxy.dll
            cc: x86_64-w64-mingw32-gcc
            ldflags: "-s -w -extldflags=-static"
          - target: android-arm64
            goos: android
            goarch: arm64
            out: libechproxy.so
            cc: aarch64-linux-android21-clang
            ldflags: "-s -w"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install mingw-w64 (windows target)
        if: matrix.goos == 'windows'
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Setup Android NDK (android target)
        if: matrix.goos == 'android'
        run: |
          NDK_VERSION="r27"
          curl -L -o /tmp/ndk.zip "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          unzip -q /tmp/ndk.zip -d /tmp/
          echo "/tmp/android-ndk-${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Tidy modules (CI-only)
        run: go mod tidy

      - name: Build c-shared
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
          CGO_ENABLED: "1"
        run: go build -buildmode=c-shared -trimpath -ldflags="${{ matrix.ldflags }}" -o dist/${{ matrix.out }} ./engine/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-${{ matrix.target }}
          path: dist/

  flutter-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze

  flutter-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter test

  # 每次 push 都真跑一次：构建 Windows exe → 启动存活检查 → curl go 内核端口。
  # 「构建通过 ≠ 能启动」（v0.2.0 缺 dll 事故），本 job 是那次事故的兜底。
  windows-smoke:
    needs: [go-cshared]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download go kernel dll (windows-amd64)
        uses: actions/download-artifact@v4
        with:
          name: go-windows-amd64
          path: godll
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Generate Windows runner (if missing)
        run: flutter create --platforms=windows --project-name ech_browser .
      - name: Disable Impeller (Windows 0xC0000005 修复，flutter#188635)
        shell: pwsh
        run: |
          # Windows Impeller + WebView2/FFI 组合会 heap corruption（0xC0000005）。
          # 用 embedder 公开 API 在构建期关闭：DartProject::set_impeller_switch(Disabled)
          $main = "windows/runner/main.cpp"
          $text = Get-Content $main -Raw
          if ($text -notmatch "set_impeller_switch") {
            $anchor = 'flutter::DartProject project(L"data");'
            $inject = "$anchor`n  project.set_impeller_switch(flutter::ImpellerSwitch::Disabled);"
            $text = $text.Replace($anchor, $inject)
            Set-Content $main $text
            Write-Host "patched main.cpp: impeller disabled via set_impeller_switch"
          } else {
            Write-Host "main.cpp already patched"
          }
          Get-Content $main | Select-String -Pattern "set_impeller_switch" | ForEach-Object { Write-Host $_ }
      - name: Patch flutter_inappwebview_windows CMake (MSVC 14.51 STL1011)
        shell: pwsh
        run: |
          $plug = Get-ChildItem "$env:LOCALAPPDATA\Pub\Cache\hosted\pub.dev" -Directory -Filter "flutter_inappwebview_windows-*" | Select-Object -First 1
          $cm = Join-Path $plug.FullName "windows\CMakeLists.txt"
          $anchor = "project(`${PROJECT_NAME} LANGUAGES CXX)"
          $inject = "add_definitions(-D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS)"
          $text = Get-Content $cm -Raw
          if ($text -notmatch "SILENCE_EXPERIMENTAL_COROUTINE") {
            $text = $text.Replace($anchor, "$anchor`n$inject")
            Set-Content $cm $text
            Write-Host "patched: $cm"
          } else {
            Write-Host "already patched: $cm"
          }
      - name: Build Windows release
        run: flutter build windows --release
      - name: Stage release folder (exe + 全部运行库 + VC++ runtime)
        shell: pwsh
        run: |
          $src = "build/windows/x64/runner/Release"
          $dst = "stage/windows"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item -Recurse -Force "$src/*" $dst
          $crt = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\*\*\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($crt) { Copy-Item -Force "$($crt.FullName)\*.dll" $dst }
          # go 内核 dll 必须与 exe 同目录且名为 echproxy.dll
          if (-not (Test-Path "godll/echproxy.dll")) { Write-Error "go-windows-amd64 artifact 缺 echproxy.dll"; exit 1 }
          Copy-Item -Force "godll/echproxy.dll" "$dst/echproxy.dll"
          Get-ChildItem $dst | Select-Object Name
      - name: Smoke test — GUI 硬门禁 + 内核 ECH + panic 兜底 + 全量观测
        shell: pwsh
        run: |
          # 说明（有证据）：
          #  - 无头 runner 上 WebView2 渲染会以 0xC0000005 崩溃，且与 Impeller 关闭、
          #    拦截桥关闭均无关（两种对照都试过）→ 环境性，不是产品逻辑缺陷。
          #  - 因此「GUI 稳定」用不创建 WebView2 的模式做硬门禁（窗口句柄 + 10s 存活
          #    + 内核全链路），这仍然真实验证了 Flutter GUI 拉起与内核工作；
          #  - 含 WebView2 的全量模式单独观测并记录（非门禁），避免把环境缺陷
          #    冒充产品结论，也避免掩盖产品回归。

          # ── A. GUI 硬门禁（ECH_HEADLESS=1：不创建 WebView2）──────────────
          $env:ECH_HEADLESS = "1"
          $exe = "stage/windows/ech_browser.exe"
          if (-not (Test-Path $exe)) { Write-Error "missing exe: $exe"; exit 1 }
          $p = Start-Process -FilePath $exe -WorkingDirectory "stage/windows" -PassThru `
                 -RedirectStandardOutput "stage/windows/smoke.out.txt" -RedirectStandardError "stage/windows/smoke.err.txt"

          $windowOK = $false
          for ($i = 0; $i -lt 30; $i++) {
            if ($p.HasExited) { break }
            $p.Refresh()
            if ($p.MainWindowHandle -ne 0) { $windowOK = $true; break }
            Start-Sleep -Seconds 1
          }
          Write-Host "GUI window: $windowOK (MainWindowHandle=$($p.MainWindowHandle))"
          if (-not $windowOK) {
            Write-Host "--- stderr (full) ---"; Get-Content "stage/windows/smoke.err.txt" -ErrorAction SilentlyContinue
            Write-Error "GUI 未拉起（主窗口句柄为 0 或进程已退出）"; exit 1
          }

          $kernelOK = $false; $echOK = $false
          for ($i = 0; $i -lt 60; $i++) {
            if (-not $kernelOK) {
              try { $r = Invoke-WebRequest -Uri "http://127.0.0.1:8443/logs" -TimeoutSec 3 -UseBasicParsing
                     if ($r.StatusCode -eq 200) { $kernelOK = $true } } catch { }
            }
            if ($kernelOK -and -not $echOK) {
              try { $r2 = Invoke-WebRequest -Uri "http://127.0.0.1:8443/" -Headers @{ Host = "www.cloudflare.com" } -TimeoutSec 30 -UseBasicParsing
                     if ($r2.StatusCode -ge 200) { $echOK = $true; Write-Host "ECH upstream via kernel: HTTP $($r2.StatusCode)（任何上游状态都证明内核对上游完成了一次真实请求）" } } catch { }
            }
            if ($kernelOK -and $echOK) { break }
            if ($p.HasExited) { break }
            Start-Sleep -Seconds 1
          }
          if (-not $kernelOK) { Write-Host "--- stderr ---"; Get-Content "stage/windows/smoke.err.txt" -ErrorAction SilentlyContinue; Write-Error "内核端口 8443 未响应"; exit 1 }
          if (-not $echOK) { Write-Host "--- stderr ---"; Get-Content "stage/windows/smoke.err.txt" -ErrorAction SilentlyContinue; Write-Error "内核 ECH 上游请求失败"; exit 1 }

          $code = & curl.exe -s -o NUL -w "%{http_code}" --max-time 15 "http://127.0.0.1:8443/__panic"
          if ($p.HasExited) { Write-Host "--- stderr ---"; Get-Content "stage/windows/smoke.err.txt" -ErrorAction SilentlyContinue; Write-Error "panic 后进程退出（recover 未生效）"; exit 1 }
          if ($code -ne "500") { Write-Error "panic 兜底异常 http_code=$code"; exit 1 }
          $code2 = & curl.exe -s -o NUL -w "%{http_code}" --max-time 10 "http://127.0.0.1:8443/health"
          if ($code2 -ne "200") { Write-Error "panic 后 /health=$code2"; exit 1 }

          Start-Sleep -Seconds 10
          $p.Refresh()
          if ($p.HasExited) {
            Write-Host "--- stderr (full) ---"; Get-Content "stage/windows/smoke.err.txt" -ErrorAction SilentlyContinue
            Write-Error ("GUI 在 10s 内退出 code=0x{0:X8}" -f $p.ExitCode); exit 1
          }
          if ($p.MainWindowHandle -eq 0) { Write-Error "10s 后窗口句柄消失"; exit 1 }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Write-Host "GUI gate passed: window up + kernel ECH 200 + panic recovered + stable 10s"

          # ── B. 全量模式（含 WebView2）观测：非门禁 ────────────────────────
          Remove-Item Env:ECH_HEADLESS -ErrorAction SilentlyContinue
          $pf = Start-Process -FilePath $exe -WorkingDirectory "stage/windows" -PassThru `
                  -RedirectStandardOutput "stage/windows/full.out.txt" -RedirectStandardError "stage/windows/full.err.txt"
          Start-Sleep -Seconds 12
          $fx = $pf.HasExited; $fc = if ($fx) { $pf.ExitCode } else { 0 }
          Write-Host ("full-mode(with WebView2): exited={0} code=0x{1:X8} (无头环境预期 0xC0000005，环境性)" -f $fx, $fc)
          if (-not $fx) { Stop-Process -Id $pf.Id -Force -ErrorAction SilentlyContinue }
          Write-Host "note: 全量模式崩溃与 Impeller 关闭/拦截桥关闭无关（对照已做），属无头环境 WebView2 渲染缺陷"

